services:
  backend:
    build:
      context: ./src/backend
      args:
        PIP_EXTRAS: "[dev]"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
      - ./output:/workspace/output
      - ./data:/workspace/data
    environment:
      APP_ENV: development
      FRONTEND_ORIGIN: http://localhost:5173
      OUTPUT_DIR: /workspace/output
      DATA_DIR: /workspace/data

  frontend:
    build:
      context: ./src/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
