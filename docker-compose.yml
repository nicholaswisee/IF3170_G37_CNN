services:
  backend:
    build:
      context: ./src/backend
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
      - ./output:/workspace/output
      - ./data:/workspace/data
    environment:
      APP_ENV: development
      FRONTEND_ORIGIN: http://localhost:5173
      OUTPUT_DIR: /workspace/output
      DATA_DIR: /workspace/data

  frontend:
    build:
      context: ./src/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
      # Frontend tests read the backend's contract fixtures via ../backend.
      - ./src/backend/tests/fixtures:/backend/tests/fixtures:ro
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
