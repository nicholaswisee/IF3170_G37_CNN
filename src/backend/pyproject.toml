[project]
name = "mejiro-express-backend"
version = "0.1.0"
description = "FastAPI scaffold for the Mejiro Express optimization project."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12,<1.0",
    "mypy>=1.15,<2.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
warn_return_any = true
